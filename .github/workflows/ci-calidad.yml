name: Pipeline de calidad

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analisis-calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install